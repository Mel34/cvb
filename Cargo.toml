[package]
name = "cvb"
version = "0.5.0"
edition = "2024"
description = "Capture, View, Bridge — terminal-to-LLM exchange utility"
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
sha2 = "0.10"
nix = { version = "0.30", features = ["term", "process", "poll", "ioctl", "signal"] }
vt100 = "0.16.2"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
sha2 = "0.10"
